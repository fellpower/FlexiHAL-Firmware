name: Modulus UF2

on:
  push:
    branches: [F446_Flexi_HAL]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.tools/platformio
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0-rc.1' }}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      profiles: ${{ steps.profiles.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: profiles
        run: echo "matrix=$(python3 scripts/release.py profiles)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.profiles) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - run: python scripts/release.py preflight
      - run: python -m unittest discover -s tests -v
      - name: Build firmware and validate UF2
        run: pio run -e "${{ matrix.environment }}"
      - name: Verify effective compiler settings and package
        run: |
          pio run -e "${{ matrix.environment }}" -t compiledb
          python scripts/release.py audit --environment "${{ matrix.environment }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.environment }}
          path: outputs/${{ matrix.environment }}/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: f446re_flexi_cnc_*
          merge-multiple: true
          path: outputs/artifacts
      - run: python3 scripts/release.py combine
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_VERSION" outputs/release/* \
            --verify-tag --draft "${args[@]}" \
            --title "FlexiHAL Modulus $RELEASE_VERSION" \
            --notes-file docs/release-notes.md
          gh release edit "$RELEASE_VERSION" --draft=false
